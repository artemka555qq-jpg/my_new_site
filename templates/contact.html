{% extends "base.html" %}
{% block title %}Контакты{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">📬 Свяжитесь с нами</h1>
        <p class="text-muted">
            Есть вопрос, предложение или нашли баг в игре? Напишите нам.
        </p>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Имя</label>
                <input type="text" name="name" class="form-control" required maxlength="100">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required maxlength="120">
            </div>

            <div class="mb-3">
                <label class="form-label">Сообщение</label>
                <textarea name="text" rows="5" class="form-control"
                          required maxlength="2000"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-send"></i> Отправить
            </button>
        </form>
    </div>
</div>
{% endblock %}
